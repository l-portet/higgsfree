# higgsfree: single-container self-hosted deployment (not needed for Vercel)
#
#   docker compose up -d
#   open http://localhost:3000
#
# The container serves the pages and passes ByteDance calls through; it stores nothing. Your keys and your library
# live in your browser.

services:
  higgsfree:
    build: .
    container_name: higgsfree
    restart: unless-stopped
    ports:
      # Host port comes from PORT (default 3000); the Node server listens on 80 inside the container.
      - "${PORT:-3000}:80"
