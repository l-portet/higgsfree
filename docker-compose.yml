# higgsfree: single-container self-hosted deployment (not needed for Vercel)
#
#   cp .env.example .env      # optional: put OPENROUTER_API_KEY there (or use the Settings page)
#   docker compose up -d
#   open http://localhost:3000
#
# Everything the app writes (SQLite DB + generated images/videos) lives in ./data.

services:
  higgsfree:
    build: .
    container_name: higgsfree
    restart: unless-stopped
    init: true
    ports:
      # The app has no login, so the port is published on the host's loopback only. Host port
      # comes from PORT in .env (default 3000); the container always listens on 3000.
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      # Fixed inside the container; overrides .env values that only make sense on the host.
      DATA_DIR: /data
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # OPENROUTER_API_KEY: sk-or-v1-...        # or set it in .env / the in-app Settings page
      # APP_URL: https://higgs.example.com      # attribution header + allowed hostname
      # APP_NAME: higgsfree
    volumes:
      - ./data:/data
