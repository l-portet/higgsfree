<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="Open-source, self-hosted AI image and video studio powered by your OpenRouter key." />
    <title>Open Higgsfield</title>

    <!-- Icons: SVG for modern browsers, PNG fallbacks (Safari), iOS home screen, PWA manifest. Sources: docs/brand/ -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Social cards. og:image must be an absolute URL on a public deployment; set your origin in front of /og-image.png. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Open Higgsfield" />
    <meta property="og:title" content="Open Higgsfield" />
    <meta property="og:description" content="Open-source AI image and video studio on your OpenRouter key." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Open Higgsfield" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Open Higgsfield" />
    <meta name="twitter:description" content="Open-source AI image and video studio on your OpenRouter key." />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
