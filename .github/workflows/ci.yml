name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # No `version:` here: the action reads `packageManager` from package.json
      # (specifying both makes it fail with "Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # The built server: the pages answer, and the ByteDance pass-through refuses what it should (no key, a call the
      # app does not make, a file off ModelArk's storage) without ever reaching ByteDance.
      - name: Server smoke test
        run: |
          pnpm start --port 3000 > next-start.log 2>&1 &
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://127.0.0.1:3000/image
          for page in / /video /favorites /settings /robots.txt /sitemap.xml; do curl -fsS -o /dev/null "http://127.0.0.1:3000$page"; done
          test "$(code http://127.0.0.1:3000/no-such-page)" = 404
          test "$(code http://127.0.0.1:3000/api/bytedance/v3/contents/generations/tasks/cgt-1)" = 401
          test "$(code -X POST -H 'Authorization: Bearer x' http://127.0.0.1:3000/api/bytedance/v3/chat/completions)" = 404
          test "$(code -H 'Authorization: Bearer x' http://127.0.0.1:3000/api/bytedance/v3/contents/generations/tasks/..%2Fx)" = 400
          test "$(code -X POST -H 'Content-Type: application/json' -d '{"url":"https://example.com/x.mp4"}' http://127.0.0.1:3000/api/bytedance/media)" = 403

  docker:
    name: Docker image (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: higgsfree:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
