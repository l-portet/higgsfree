name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor from `engines` (first release with node:sqlite); 26 is what the
        # maintainer runs. node:sqlite has changed between majors, so both are exercised.
        node: [22, 26]
    steps:
      - uses: actions/checkout@v4

      # No `version:` here: the action reads `packageManager` from package.json
      # (specifying both makes it fail with "Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build client
        run: pnpm build

      - name: Upload client bundle
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: dist/client
          retention-days: 7
          if-no-files-found: error

  docker:
    name: Docker image (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: open-higgsfield:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
